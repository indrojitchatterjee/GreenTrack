<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GreenTrack - Reset Password</title>

    <link
        rel="stylesheet"
        href="login.html">

    <link
        rel="stylesheet"
        href="forgot-password.css"
    >

</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <div class="brand">
                🌿 Green<span>Track</span>
            </div>


            <!-- ============================
                 STEP 1: request a code
            ============================= -->

            <div id="step1">

                <h1>
                    Reset your password
                </h1>

                <p class="muted">
                    Enter your email or phone to receive a reset code.
                </p>


                <form id="requestForm">

                    <label for="identifier">
                        Email or Phone
                    </label>

                    <input
                        type="text"
                        id="identifier"
                        placeholder="you@example.com or phone number"
                        required
                    >


                    <label>
                        Send code via
                    </label>

                    <div class="method-choice">

                        <label class="radio-option">
                            <input
                                type="radio"
                                name="method"
                                value="email"
                                checked
                            >
                            Email
                        </label>

                        <label class="radio-option">
                            <input
                                type="radio"
                                name="method"
                                value="sms"
                            >
                            SMS
                        </label>

                    </div>


                    <button type="submit">
                        Send Reset Code
                    </button>


                    <p
                        id="requestMessage"
                        class="message"
                    ></p>

                </form>

            </div>


            <!-- ============================
                 STEP 2: verify code + set new password
            ============================= -->

            <div
                id="step2"
                style="display:none;"
            >

                <h1>
                    Enter reset code
                </h1>

                <p class="muted">
                    Check your email or phone for the 6-digit code.
                </p>


                <form id="resetForm">

                    <label for="otp">
                        Reset Code
                    </label>

                    <input
                        type="text"
                        id="otp"
                        placeholder="6-digit code"
                        maxlength="6"
                        required
                    >


                    <label for="newPassword">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Create a new password"
                        required
                    >


                    <label for="confirmNewPassword">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Repeat new password"
                        required
                    >


                    <button type="submit">
                        Reset Password
                    </button>


                    <p
                        id="resetMessage"
                        class="message"
                    ></p>

                </form>


                <p class="login-link">
                    Didn't get a code?
                    <a href="#" id="resendLink">Start over</a>
                </p>

            </div>


            <p class="login-link">
                Remembered your password?
                <a href="login.html">Login</a>
            </p>

        </section>

    </main>


    <script src="forgot-password.js"></script>

</body>

</html>
